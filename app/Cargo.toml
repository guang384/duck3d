# duck3d 原生应用：wgpu(DX12/Vulkan) 硬件渲染 + ONNX Runtime 策略推理。
# 独立 crate（不在机器人 workspace 里）—— [workspace] 表示脱离父 workspace。
[workspace]

[package]
name = "duck3d-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
pollster = "0.4"
# ort 版本与 robotd 对齐（=2.0.0-rc.11）；download-binaries 在构建时自动下载
# ONNX Runtime 并静态链接 —— 用户机器上无需任何 dll 配置。
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs"] }
wgpu = "24"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
winit = "0.30"
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
mujoco-rs = { version = "6.1.0", features = ["auto-download-mujoco"] }

[profile.release]
opt-level = 3
lto = "thin"
